name: Download the pinned AdCP compliance bundle
description: >
  Resolve the pinned AdCP spec version from the INSTALLED SDK, download that
  release bundle from adcontextprotocol/adcp, verify its sha256, and extract it
  into tests/storyboard/runner/ where storyboard_spec.adcp_home() looks for it.

  One source for the version, used by every job that needs the tree. Before this
  action the unit job regex-parsed the version out of the PROSE of
  docs/adcp-spec-version.md and the storyboard job hardcoded it, so the two could
  disagree with each other and both could disagree with the wheel actually
  installed. storyboard_spec.pinned_version() reads adcp.get_adcp_spec_version(),
  which is the version the installed wheel reports for itself and therefore
  cannot disagree with the code under audit.

  Requires ./.github/actions/_setup-env to have run first: the version comes from
  the SDK in the project venv, not from a file.

outputs:
  version:
    description: The pinned AdCP spec version, as reported by the installed SDK.
    value: ${{ steps.resolve.outputs.version }}
  bundle-dir:
    description: Repo-relative path of the extracted bundle (adcp_home()'s second candidate).
    value: ${{ steps.resolve.outputs.bundle-dir }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      run: |
        set -euo pipefail
        version="$(uv run python -c \
          'import pathlib; from scripts.audit import storyboard_spec; print(storyboard_spec.pinned_version(pathlib.Path(".")))')"
        if [ -z "$version" ]; then
          echo "::error::could not resolve the pinned AdCP version from the installed SDK"
          exit 1
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "bundle-dir=tests/storyboard/runner/adcp-${version}" >> "$GITHUB_OUTPUT"
        echo "pinned AdCP version (from the installed SDK): ${version}"

    - shell: bash
      working-directory: tests/storyboard/runner
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.resolve.outputs.version }}
      run: |
        set -euo pipefail
        gh release download "v${VERSION}" --repo adcontextprotocol/adcp \
          -p "${VERSION}.tgz" -p "${VERSION}.tgz.sha256"
        shasum -a 256 -c "${VERSION}.tgz.sha256"
        tar -xzf "${VERSION}.tgz"
        # The path is spelled twice, in two languages: here, and by
        # storyboard_spec.adcp_home() in Python. Nothing made them agree, and
        # the failure mode was silent -- 25 guards across 7 modules skipping
        # themselves off with the job still green. Assert the extraction landed
        # where the resolver actually looks.
        if [ ! -d "adcp-${VERSION}/compliance" ]; then
          echo "::error::bundle extracted, but adcp-${VERSION}/compliance is not a directory."
          echo "::error::storyboard_spec.adcp_home() resolves tests/storyboard/runner/adcp-<version>;"
          echo "::error::the tarball root or BUNDLE_PARENT has diverged. Contents:"
          ls -la
          exit 1
        fi
